<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exit Exam</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>ระบบจัดการคำขอเปลี่ยนบทบาท</h1>   
      <div class="err" id="err-box"></div>

      <div class="box">
        <h2>ผู้ใช้งานปัจจุบัน</h2>
        <p>
          <label for="currentUserSelect">เลือกผู้ใช้ :</label>
          <select id="currentUserSelect"></select>
        </p>
      </div>

      <div class="box">
        <h2>รายการสมาชิก</h2>
        <table id="memberTable" border="1" cellpadding="6" cellspacing="0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Role</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="box">
        <h2>สร้างคำขอเปลี่ยน Role ใหม่</h2>
        <button type="button" id="btnShowCreateForm"">สร้างคำขอ</button>

        <form id="createRequestForm" style="display: none; margin-top: 10px;">

            <p>
                <label for="targetSelected">สมาชิกที่จะเปลี่ยน : </label>
                <select id="targetSelected"></select>
            </p>
            <p>
                <label for="roleSelected">Role : </label>
                <select id="roleSelected">
                </select>
            </p>
            <button type="submit">Create Request</button>
        </form>
      </div>

      <div class="box">
        <h2>รายการคำขอเปลี่ยนบทบาท</h2>
        <div class="scroll">
          <table id="requestTable" border="1" cellpadding="6" cellspacing="0">
            <thead>
              <tr>
                <th>ID</th>
                <th>ผู้เสนอ</th>
                <th>เป้าหมาย</th>
                <th>บทบาทใหม่</th>
                <th>สถานะ</th>
                <th>ความเห็นอนุมัติ/ไม่อนุมัติ</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
  <script src="js/models/Member.js"></script>
  <script src="js/models/Request.js"></script>
  <script src="js/views/AppView.js"></script>
  <script src="js/controllers/RequestController.js"></script>
